[project]
name = "mini-alpha"
version = "0.7.0"
description = "A small financial research agent built with an explicit LangGraph."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115.0,<1",
    "langchain-core>=1.5.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34.0,<1",
    "yfinance>=0.2.65,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.0.0",
    "ruff>=0.12.0,<1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
