services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: minialpha
      POSTGRES_PASSWORD: minialpha
      POSTGRES_DB: minialpha
    ports:
      - "5433:5432"
    volumes:
      - minialpha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minialpha -d minialpha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - minialpha_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minialpha_postgres_data:
  minialpha_redis_data:
